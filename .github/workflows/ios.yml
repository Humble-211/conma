name: ios

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Lint and localization checks
        run: |
          python3 scripts/check_localization.py
          python3 scripts/lint_sources.py
      - name: Data package tests
        run: swift test --package-path Packages/Data
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['isAvailable']]; p=[x for x in c if x['name'].startswith('iPhone 16')] or [x for x in c if x['name'].startswith('iPhone')]; print(p[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build app
        run: |
          xcodebuild build \
            -project ConMa.xcodeproj \
            -scheme ConMa \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            | xcbeautify --quiet || exit ${PIPESTATUS[0]}
      - name: UI tests
        run: |
          xcodebuild test \
            -project ConMa.xcodeproj \
            -scheme ConMa \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -resultBundlePath build/UITests.xcresult \
            | xcbeautify --quiet || exit ${PIPESTATUS[0]}
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots || echo "attachment export failed"
          (ls -R build/screenshots | head -50) || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/UITests.xcresult
