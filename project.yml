# Bundle id and team id are provisional; replace per docs/SETUP.md §5.
name: ConstructionManagement
options:
  bundleIdPrefix: com.humble211
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: TEAM_ID_PLACEHOLDER
    CODE_SIGN_STYLE: Manual
    SWIFT_STRICT_CONCURRENCY: targeted
    CURRENT_PROJECT_VERSION: 1
packages:
  Domain:
    path: Packages/Domain
  Data:
    path: Packages/Data
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features
targets:
  ConstructionManagement:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Construction Management
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, vi]
        CFBundleDevelopmentRegion: en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humble211.constructionmanagement
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        Debug:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: false
          CODE_SIGNING_ALLOWED: false
        Release:
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.humble211.constructionmanagement"
    dependencies:
      - package: Domain
      - package: Data
      - package: DesignSystem
      - package: Features
  ConstructionManagementUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humble211.constructionmanagement.uitests
        CODE_SIGNING_ALLOWED: false
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ConstructionManagement
schemes:
  ConstructionManagement:
    build:
      targets:
        ConstructionManagement: all
        ConstructionManagementUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ConstructionManagementUITests]
    archive:
      config: Release
